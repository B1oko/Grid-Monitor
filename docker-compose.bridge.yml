# Use this on Docker Desktop (macOS/Windows) where host networking is unavailable.
# Discovery will not see your LAN — add the inverter IP in the setup wizard.

services:
  grid-monitor:
    image: ghcr.io/${GITHUB_REPOSITORY:-grid-monitor/grid-monitor}:latest
    build: .
    container_name: grid-monitor
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - gridmonitor-data:/data
    environment:
      TZ: UTC
      DATA_DIR: /data

volumes:
  gridmonitor-data:
