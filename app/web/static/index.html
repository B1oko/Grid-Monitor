<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grid Monitor</title>
    <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grid Monitor" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch {}
    </script>
  </head>
  <body class="booting">
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#/">
          <img src="/static/icon.svg" alt="" width="34" height="34" />
          <span>Grid Monitor</span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot">
          <span class="conn" data-connection></span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <h1 id="page-title">Grid Monitor</h1>
          <div class="topbar-actions">
            <select id="inverter-picker" class="picker" hidden></select>
            <span class="conn conn-compact" data-connection></span>
          </div>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>

      <nav class="tabbar" id="tabbar"></nav>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/static/vendor/chart.umd.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
