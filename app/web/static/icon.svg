  <line x1="212" y1="256" x2="300" y2="256" stroke="#2f6f73" stroke-width="10"/>
  <line x1="212" y1="297" x2="300" y2="297" stroke="#2f6f73" stroke-width="10"/>
  <line x1="235" y1="192" x2="235" y2="320" stroke="#2f6f73" stroke-width="10"/>
  <line x1="277" y1="192" x2="277" y2="320" stroke="#2f6f73" stroke-width="10"/>
</svg>
