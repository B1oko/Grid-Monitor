name: Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A version on main without its vX.Y.Z tag is a new release: publish the
      # version and latest images, then create the tag and GitHub release.
      - name: Version
        id: version
        run: |
          version=$(python3 scripts/version.py --print)
          release=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            release=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image list
        id: images
        run: |
          images="ghcr.io/${{ github.repository }}"
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            images="${images}
          ${{ vars.DOCKERHUB_USERNAME }}/grid-monitor"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$images" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Pushed with GITHUB_TOKEN, so the new tag does not start this workflow again.
      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/version.py --notes > "$RUNNER_TEMP/notes.md"
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
